name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest -q

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[build]"
      - run: pyinstaller --noconfirm --clean --onefile --name TOSKINSTALLER src/toskinstaller/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: TOSKINSTALLER-windows
          path: dist/TOSKINSTALLER.exe
